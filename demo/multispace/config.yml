# Multi-space demo: the same actin structures as the cluster-mode demo, but
# with the map built through the block/space machinery as well as through the
# legacy path.
#
# Everything the legacy pipeline produces is still produced, byte for byte. The
# `blocks` and `spaces` keys are additive: they add `blocks/` and `spaces/`
# directories to the output and add nothing to, and take nothing from, the
# existing outputs.
#
# Run it with:
#   snakemake --configfile demo/multispace/config.yml --use-conda --cores 8

mode: "cluster"
analysis_name: "multispace-demo"
input_dir: "demo/cluster-mode/input"
output_dir: "demo/multispace/output"

features_file: "uniprot_features.tsv"

# The legacy plotting modes still drive the legacy outputs.
plotting_modes:
- "pca_umap"

# `key_protids` is deliberately empty. Setting it pulls the Foldseek web API
# into the DAG even in cluster mode -- `aggregate_foldseek_fraction_seq_identity`
# and `calculate_concordance` are expanded for key protids as *common* inputs,
# not search-mode-only -- so a config that sets it is not offline. See
# docs/EXPLORATION.md.

# ------------------------------------------------------------------------------
# Multi-space configuration
# ------------------------------------------------------------------------------

blocks:
  # The pipeline's existing representation, as a block. `profile` means each
  # protein is described by its row of the similarity matrix, which is what the
  # pipeline has always done and is invariant to the column permutation that
  # PR #106 fixed. `direct` reads the matrix as a matrix and is gated behind a
  # verified alignment -- see docs/adr/0007-matrix-index-alignment.md.
  tmscore:
    provider: tmscore
    representation: profile
    normalization: unit_mean_distance

  # Foldseek's 3Di alphabet as k-mer frequencies. Local structure, where
  # `tmscore` is global: two proteins sharing a domain but differing in how
  # their domains are arranged score poorly under TM-score, because no single
  # rigid superposition fits both, and score alike here. The two spaces are
  # meant to disagree, and where they disagree is the finding.
  threedi:
    provider: threedi
    k: 3
    scaling: frequency

  # Bulk physicochemical descriptors from the sequence: hydropathy, charge,
  # isoelectric point, aromatic content. Not shape at all, which is why it is
  # worth having beside two blocks that are. Every default descriptor is
  # intensive -- a mean, a fraction or a pH -- so the block cannot smuggle
  # protein length in as an axis. `molecular_weight` is available and is
  # deliberately not a default; see ProteinCartography/blocks/biophys.py.
  biophys:
    provider: biophys

  # Curated family membership from Pfam, already present in the UniProt
  # metadata the pipeline downloads. External evidence rather than another
  # measurement of these structures, which is what makes it worth co-registering
  # against them: agreement is confirmation, disagreement is either a remote
  # homolog the structural map missed or an annotation artifact.
  domains:
    provider: domains
    source: pfam

spaces:
  structure:
    blocks: [tmscore]
    strategy: none
    reducers: [pca_umap, pca_tsne]

  # A second, independent geometry over the same protein index. Not fused with
  # `structure` -- co-registration is the default product and fusion is an
  # explicitly invoked analysis. See docs/adr/0001-block-space-view.md.
  local_structure:
    blocks: [threedi]
    strategy: none
    reducers: [pca_umap]

  # A third geometry, over the same protein index and from a different kind of
  # evidence entirely. Where it agrees with `structure` is the interesting part:
  # two proteins can be physicochemically alike and structurally unrelated, and
  # a co-registered pair of maps shows that where a single fused map hides it.
  physicochemistry:
    blocks: [biophys]
    strategy: none
    reducers: [pca_umap]

  # A fourth geometry, from annotation rather than measurement. On this demo's
  # eleven actins it is nearly degenerate -- they almost all carry the same
  # single Pfam family -- which is itself the honest result for a cohort this
  # homogeneous, and a useful thing for the demo to show.
  families:
    blocks: [domains]
    strategy: none
    reducers: [pca_umap]

# Co-registration is the product, not a diagnostic. Four independent geometries
# over one protein index are only worth building if you can ask where they
# disagree, and these are the four the demo asks about. Each pair gets a
# per-protein neighborhood Jaccard and rank correlation, plus a Procrustes
# disparity between the two `pca_umap` layouts.
#
# `structure` is the reference, so the shared index inherits its protein order --
# the order the similarity matrix was written in, which is the order every
# legacy output already uses.
coregistration:
  reference_space: structure
  compare: [structure, local_structure, physicochemistry, families]
  k: 5

# Overlay-only signals may be declared here and used as overlays, but the
# validator will refuse to fuse them into a geometry, with the circularity
# reason in the error. See docs/adr/0003-the-fusable-flag.md.
