name: lint

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.9"

      # These pins are the source of truth for the linters. They used to be copied
      # from `envs/cartography_dev.yml`, which has been deleted; `CONTRIBUTING.md`
      # now points contributors here, which is the direction that cannot drift.
      - name: Install lint dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff==0.1.6 snakefmt==0.8.5

      - name: Run Ruff
        run: ruff check --output-format=github .

      - name: Run Ruff formatter
        run: ruff format --check .

      - name: Run Snakefmt
        run: snakefmt --check .
